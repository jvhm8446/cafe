<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café | Menú</title><meta name="theme-color" content="#153e31"><style>*{box-sizing:border-box}body{background:#12392b;color:#f5e8d0;margin:0;font-family:Georgia,serif}.tv{min-height:100vh;padding:4vh 5vw 3vh;display:flex;flex-direction:column;background:radial-gradient(circle at 90% 0%,#305b42,#12392b 60%)}.header,.footer{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #6e937b;padding-bottom:2vh}.eyebrow{font:700 1.1vw Arial,sans-serif;letter-spacing:.23em;color:#bbcfb9}.header h1{font-size:6.5vw;font-weight:normal;margin:0}.gold,.item strong{color:#eec482}.header p{font-size:1.6vw;margin:0}.header button{border:1px solid #8ca88c;border-radius:8px;padding:1vw;color:#f5e8d0;background:transparent;cursor:pointer;font-size:1vw}.body{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 4vw}.item{border-bottom:1px solid #6e937b;display:flex;justify-content:space-between;align-items:center;padding:2.4vh 0;gap:15px}.item small{font:1.1vw Arial,sans-serif;color:#bdd0bd}.item h2{font-size:2.6vw;font-weight:normal;margin:.6vh 0;overflow-wrap:anywhere}.item strong{font-size:2.7vw;white-space:nowrap;font-weight:normal}.item .sold{font:1vw Arial,sans-serif;color:#eec482}.footer{border-bottom:0;border-top:1px solid #6e937b;padding:2vh 0 0;color:#bdd0bd;font:1.2vw Arial,sans-serif}#status{color:#eec482;font:1.4vw Arial,sans-serif;margin-top:4vh}@media(max-width:650px){.grid{grid-template-columns:1fr}.header h1{font-size:11vw}.header p{font-size:3vw}.item h2,.item strong{font-size:5vw}.item small,.item .sold,.footer,#status{font-size:3vw}.header button{font-size:2.5vw}}</style><script defer src="configuracion.js"></script></head><body><main class="tv"><header class="header"><div><div class="eyebrow">MENÚ DEL DÍA</div><h1>Café<span class="gold">.</span></h1><p>Elige tu favorito</p></div><button id="fullscreen">Pantalla completa</button></header><section class="body"><div class="grid" id="items"></div><p id="status">Cargando menú...</p></section><footer class="footer"><span>Bienvenido a Café</span><span id="number"></span></footer></main>
<script>window.addEventListener('load',function(){'use strict';var screen=/[?&]pantalla=2(?:&|$)/.test(location.search)?'2':'1',cfg=window.CAFE_CONFIG||{},items=[],signature='',page=0,busy=false,queued=false,url='';document.getElementById('number').textContent='Pantalla '+screen;
var button=document.getElementById('fullscreen'),root=document.documentElement,fn=root.requestFullscreen||root.webkitRequestFullscreen;if(fn)button.onclick=function(){try{var p=fn.call(root);if(p&&p.catch)p.catch(function(){})}catch(e){}};else button.hidden=true;
function node(tag,parent,txt,cls){var n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;parent.appendChild(n);return n}
function draw(){var box=document.getElementById('items');box.textContent='';var offset=page%Math.max(1,Math.ceil(items.length/8))*8;items.slice(offset,offset+8).forEach(function(p){var row=node('div',box,'','item'),left=node('div',row,'');node('small',left,p.category);node('h2',left,p.name);if(!p.available)node('div',left,'Agotado','sold');node('strong',row,'$'+(p.cents/100).toFixed(2))})}
function refresh(){if(busy){queued=true;return}busy=true;var r=new XMLHttpRequest();r.open('GET',url);r.timeout=10000;var finish=function(){busy=false;if(queued){queued=false;refresh()}};r.onload=function(){if(r.status===200){try{var obj=JSON.parse(r.responseText)||{};var next=Object.keys(obj).map(function(k){return obj[k]}).filter(function(p){return p&&(p.screen===screen||p.screen==='both')}).sort(function(a,b){return a.category.localeCompare(b.category)||a.name.localeCompare(b.name)}),s=JSON.stringify(next);if(s!==signature){signature=s;items=next;page=0;draw()}document.getElementById('status').textContent=items.length?'':'Aún no hay productos para esta pantalla.'}catch(e){document.getElementById('status').textContent='Error al leer el menú.'}}else document.getElementById('status').textContent='Sin conexión. Se mantiene el último menú.';finish()};r.onerror=r.ontimeout=function(){document.getElementById('status').textContent='Sin conexión. Se mantiene el último menú.';finish()};r.send()}
if(!cfg.databaseURL){document.getElementById('status').textContent='Falta conectar Firebase. Configuración pendiente.';return}
url=cfg.databaseURL.replace(/\/$/,'')+'/menu/products.json';refresh();setInterval(refresh,15000);setInterval(function(){if(items.length>8){page++;draw()}},12000);if(window.EventSource)try{var s=new EventSource(url);s.addEventListener('put',refresh);s.addEventListener('patch',refresh);s.addEventListener('cancel',function(){s.close()})}catch(e){}
});</script></body></html>
